<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Australian Fracture Group</title>
  <meta name="description" content="The Australian Fracture Group (AFG): a society for fracture mechanics and structural integrity in Australia, established in 1971.">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23242424'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' text-anchor='middle' fill='%23f4f4f0'%3EAFG%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- LAYOUT FILES: editors do not need to touch css/ or js/. Content lives in data/*.json -->
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#history">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#top" aria-label="Australian Fracture Group, back to top">AFG</a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Menu</span>
        <span class="bars" aria-hidden="true"></span>
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Main">
        <a href="#history">History</a>
        <a href="#members">Members</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section id="top" class="hero">
      <div class="container hero-inner">
        <h1 id="hero-title">Australian Fracture Group</h1>
        <p id="hero-tagline" class="tagline">Advancing fracture mechanics in Australia since 1971</p>
      </div>
    </section>

    <noscript>
      <p class="noscript">This page needs JavaScript switched on to show its content.</p>
    </noscript>

    <!-- HISTORY -->
    <section id="history" class="section section--light" aria-labelledby="history-heading">
      <div class="container split">
        <div class="split-head">
          <h2 id="history-heading">History</h2>
          <p class="byline" id="history-byline"></p>
        </div>
        <div class="split-body" id="history-body">
          <p class="loading">Loading…</p>
        </div>
      </div>
    </section>

    <!-- MEMBERS -->
    <section id="members" class="section section--dark" aria-labelledby="members-heading">
      <div class="container split">
        <div class="split-head">
          <h2 id="members-heading">Members</h2>
        </div>
        <div class="split-body" id="committee-body">
          <p class="loading">Loading…</p>
        </div>
      </div>
      <div class="container group-wrap">
        <h3 class="group-title">Group members</h3>
        <div class="alpha-grid" id="group-members"></div>
      </div>
    </section>

    <!-- EVENTS -->
    <section id="events" class="section section--light" aria-labelledby="events-heading">
      <div class="container split">
        <div class="split-head">
          <h2 id="events-heading">Events</h2>
        </div>
        <div class="split-body" id="events-body">
          <p class="loading">Loading…</p>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section section--dark" aria-labelledby="contact-heading">
      <div class="container split">
        <div class="split-head">
          <h2 id="contact-heading">Contact</h2>
        </div>
        <div class="split-body" id="contact-body">
          <p class="loading">Loading…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-text">&copy; Australian Fracture Group</p>
    </div>
  </footer>
</body>
</html>
